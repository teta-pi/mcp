name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy → mcp.tetapi.dev
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build MCP server
        run: |
          npm install
          npx tsc

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/tetapi_ed25519
          chmod 600 ~/.ssh/tetapi_ed25519
          ssh-keyscan -H 164.90.235.66 >> ~/.ssh/known_hosts

      - name: Sync MCP server
        run: |
          # --chown=root:root on EVERY rsync: without it, `-a` implies -o -g
          # and, running as root on the receiver, rsync preserves the runner's
          # numeric uid/gid (user `runner` = 1001). uid 1001 on the droplet is
          # co-tenant `hellfire`, so every mcp deploy chowned
          # /opt/tetapi/mcp/dist (which `tetapi-mcp` executes as root via
          # `node dist/index.js`) and /opt/tetapi/mcp/package.json (which the
          # next deploy feeds to `npm install` as root — a lifecycle-script
          # path) to hellfire:hellfire. Both are co-tenant->root (S-19, the
          # same trap 5.11 fixed in api). Forcing root:root keeps the tree
          # owned by root. (rsync >=3.1.0 on both ends.)
          rsync -az --chown=root:root -e "ssh -i ~/.ssh/tetapi_ed25519" \
            --delete \
            dist/ root@164.90.235.66:/opt/tetapi/mcp/dist/
          rsync -az --chown=root:root -e "ssh -i ~/.ssh/tetapi_ed25519" \
            package.json \
            root@164.90.235.66:/opt/tetapi/mcp/

      - name: Install prod deps + restart
        run: |
          ssh -i ~/.ssh/tetapi_ed25519 root@164.90.235.66 bash << 'REMOTE'
          set -e
          cd /opt/tetapi/mcp && npm install --omit=dev --no-audit --no-fund
          systemctl restart tetapi-mcp
          sleep 3
          systemctl is-active --quiet tetapi-mcp \
            && echo "✓ MCP up" \
            || { journalctl -u tetapi-mcp -n 30 --no-pager; exit 1; }
          REMOTE
